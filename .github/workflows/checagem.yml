name: Checagem

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Testar o processamento com um vídeo sintético
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r processor/requirements.txt
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=720x1280:rate=30:duration=6 \
            -f lavfi -i "sine=frequency=220:duration=6" -shortest teste.mp4
          python processor/melhorar.py teste.mp4 saida.mp4
          ffprobe -v error -show_entries stream=codec_name -of csv saida.mp4
      - name: Construir a imagem do container
        run: docker build -t processor processor
