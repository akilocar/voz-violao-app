name: Deploy no Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Testar o processamento com um vídeo sintético
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r processor/requirements.txt
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=720x1280:rate=30:duration=6 \
            -f lavfi -i "sine=frequency=220:duration=6" -shortest teste.mp4
          python processor/melhorar.py teste.mp4 saida.mp4
          ffprobe -v error -show_entries stream=codec_name -of csv saida.mp4
      - name: Construir a imagem do container
        run: docker build -t processor processor

  deploy:
    needs: checar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Criar fila (ignora se já existe)
        run: npx wrangler queues create voz-violao-processamento || true
      - name: Apagar vídeos depois de 7 dias (ignora se já existe)
        run: npx wrangler r2 bucket lifecycle add voz-violao-videos apagar-7-dias --expire-days 7 --force || true
      - name: Aplicar migrações do banco
        run: npx wrangler d1 migrations apply voz-violao --remote
      - name: Publicar Worker e container
        run: npx wrangler deploy
